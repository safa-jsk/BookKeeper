[build]
  # we’re deploying just the backend (as functions); no static "publish" dir needed
  base = "backend"
  command = "npm install"
  publish = "backend" # arbitrary; functions don't need this

[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"
  included_files = ["backend/src/public/**"] # bundle avatars/static (read-only in prod)

# Map /api/* to the function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
